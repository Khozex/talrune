[package]
name = "talrune"
version = "0.2.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiktoken-rs = "0.5.3"
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
thiserror = "1"

[dev-dependencies]
httpmock = "0.6"
